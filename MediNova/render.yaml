databases:
  - name: medinova-db
    databaseName: medinova
    user: medinova
    plan: free

services:
  - type: web
    name: medinova-pia
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: medinova-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: medinova-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: medinova-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: medinova-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: medinova-db
          property: password

